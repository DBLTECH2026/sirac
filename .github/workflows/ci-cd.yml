name: CI/CD SIRAC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Pruebas backend (Django + IA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Revisar configuración de Django
        run: python manage.py check
      - name: Entrenar modelos (datos simulados)
        run: python -m ia.ml.entrenar
      - name: Pruebas automáticas (búsqueda, machine learning y API)
        run: pytest -v

  frontend:
    name: Compilación frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build

  desplegar:
    name: Despliegue en VPS (Hostinger KVM 2)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://sirac.dbltech.tech
    steps:
      - name: Preparar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Actualizar código, construir y verificar (con rollback)
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/sirac && PREV=$(git rev-parse HEAD) && git fetch -q origin main && git reset -q --hard origin/main && PREV=$PREV bash scripts/desplegar.sh'
      - name: Prueba de humo desde internet
        run: |
          curl -fsS https://sirac.dbltech.tech/api/salud
          curl -fsS -o /dev/null -w "Front-end: HTTP %{http_code}\n" https://sirac.dbltech.tech/
