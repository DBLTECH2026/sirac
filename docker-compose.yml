name: sirac

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sirac
      POSTGRES_USER: sirac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - db_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirac -d sirac"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://sirac:${POSTGRES_PASSWORD}@db:5432/sirac
      DJANGO_ALLOWED_HOSTS: sirac.dbltech.tech,backend,localhost,127.0.0.1
      GIT_SHA: ${GIT_SHA:-sin-version}
      SERVIDOR_VPS: srv2164565.hstgr.cloud
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  db_datos:
  caddy_datos:
  caddy_config:
